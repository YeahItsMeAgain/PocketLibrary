[package]
name = "pocketlibrary_core"
version = "0.1.0"
description = "SQLite catalogue and service layer for PocketLibrary"
edition = "2024"

[lib]
name = "pocketlibrary_core"
path = "src/lib.rs"

[dependencies]
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
