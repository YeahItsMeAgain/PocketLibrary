[package]
name = "pocketlibrary_core"
version = "0.1.0"
description = "SQLite catalog and service layer for PocketLibrary"
edition = "2024"

[lib]
name = "pocketlibrary_core"
path = "src/lib.rs"

[dependencies]
base64 = "0.22"
blake3 = "1"
hayro = "0.9.0"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
lopdf = "0.47.0"
rbook = "0.7.13"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
zip = { version = "9.8.2", default-features = false, features = ["deflate"] }
