[package]
name = "pocketlibrary-spine"
version = "0.1.0"
edition = "2021"
description = "On-device cover-to-spine pipeline for PocketLibrary (DBNet + CIELAB mask + crop/MI-GAN + 52x236 QA)"
license = "Apache-2.0"

[lib]
name = "pocketlibrary_spine"
path = "src/lib.rs"

[[bin]]
name = "spine-host"
path = "src/bin/spine_host.rs"

[dependencies]
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
ndarray = "0.17"
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["load-dynamic", "ndarray"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fontdue = "0.9"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
