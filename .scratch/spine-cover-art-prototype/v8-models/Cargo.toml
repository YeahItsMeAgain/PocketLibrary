[package]
name = "v8-models-eval"
version = "0.1.0"
edition = "2021"
description = "Read-only evaluator for quantized v8 inpainting models"
license = "Apache-2.0"

[dependencies]
v8-app = { path = "../v8-app" }
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
