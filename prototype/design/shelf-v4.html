<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0908">
<title>PocketLibrary — shelf v4 (PROTOTYPE)</title>
<!--
  THROWAWAY PROTOTYPE — not production code.
  Question: can a single darker, furniture-grade Victorian library carry the
  V1 spine colours, V3 detail composition and a real cover, with compositor-only motion?
  Open directly in a browser. No build, no server, no network at runtime.
-->
<style>
/* ============================================================
   0. Tokens, reset, primitives
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; }

:root {
  --display: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, "Hoefler Text", Georgia, "Noto Serif", serif;
  --body: "Iowan Old Style", Palatino, "Book Antiqua", Georgia, "Noto Serif", serif;

  /* night-time room */
  --room-0: #0b0908;
  --room-1: #15100c;
  --room-2: #211811;

  /* furniture */
  --wood-0: #0d0805;
  --wood-1: #1a110b;
  --wood-2: #241810;
  --wood-3: #332316;
  --wood-4: #4a3521;
  --wood-5: #5c4229;

  /* metal + paper */
  --brass: #b08d57;
  --brass-hi: #c9a86a;
  --brass-lo: #7d6238;
  --paper: #e7dcc6;
  --paper-dim: #c8b99e;
  --ink: #2a2118;

  /* label palette (muted, never saturated) */
  --oxblood: #6e2b2b;
  --forest: #2f4a3c;
  --navy: #2b3a55;
  --mustard: #9a7b3f;
  --plum: #4a2f3a;
  --slate: #46505a;
  --rose: #8a5a5a;

  /* motion */
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  --ease-io: cubic-bezier(0.4, 0, 0.2, 1);
  --dur-lift: 260ms;
  --dur-open: 480ms;
  --dur-exit: 300ms;
  --dur-fade: 320ms;
}

html, body { margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; overflow-x: hidden; background: var(--room-0); }
body {
  min-height: 100vh; overflow-x: hidden;
  font-family: var(--body); color: var(--paper);
  background:
    radial-gradient(90% 44% at 50% -4%, rgba(53, 37, 24, .75), transparent 66%),
    linear-gradient(180deg, #0c0a08 0%, #080605 55%, #050403 100%);
}
body::before {
  content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image:
    repeating-linear-gradient(90deg, rgba(201,168,106,.022) 0 1px, transparent 1px 78px),
    repeating-linear-gradient(180deg, rgba(201,168,106,.014) 0 1px, transparent 1px 120px);
}
button {
  font: inherit; color: inherit; background: none; border: 0; padding: 0;
  cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none; user-select: none;
}
[hidden] { display: none !important; }
img { display: block; }
::selection { background: rgba(176, 141, 87, .35); color: var(--paper); }

#app, #detail-root { position: relative; z-index: 1; }

.visually-hidden {
  position: absolute; width: 1px; height: 1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap;
}
.sc { font-variant: small-caps; letter-spacing: .18em; text-transform: lowercase; }

/* ============================================================
   1. Room, masthead, filter strip
   ============================================================ */
.room { position: relative; min-height: 100vh; padding-bottom: 30px; }

.vignette {
  position: fixed; inset: 0; z-index: 40; pointer-events: none;
  background:
    radial-gradient(120% 88% at 50% 8%, transparent 42%, rgba(0,0,0,.34) 70%, rgba(0,0,0,.72) 100%),
    linear-gradient(180deg, transparent 62%, rgba(0,0,0,.38) 100%);
}

.mast { padding: 28px 22px 13px; text-align: center; position: relative; }
.mast .kicker {
  margin: 0; font-size: 8px; letter-spacing: .36em; text-transform: uppercase;
  color: #9b8154;
}
.mast h1 {
  margin: 8px 0 5px; font-family: var(--display); font-weight: 400;
  font-size: 28px; line-height: 1; letter-spacing: .13em; text-transform: uppercase;
  color: var(--brass-hi);
  text-shadow: 0 1px 0 #2b1e10, 0 0 24px rgba(176,141,87,.18);
}
.mast .orn { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 9px auto 0; max-width: 230px; color: var(--brass-lo); }
.mast .orn::before, .mast .orn::after {
  content: ""; flex: 1; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(176,141,87,.65), transparent);
}
.mast .orn svg { width: 20px; height: 14px; }
.mast .sub {
  margin: 8px 0 0; font-size: 7.5px; letter-spacing: .3em; text-transform: uppercase;
  color: #8a7350;
}

.filterbar {
  position: sticky; top: 0; z-index: 60;
  padding: 6px 9px 7px;
  background:
    linear-gradient(180deg, rgba(201,168,106,.10), transparent 26%),
    linear-gradient(180deg, rgba(18,13,9,.97), rgba(9,7,5,.985));
  border-top: 1px solid rgba(201,168,106,.34);
  border-bottom: 1px solid rgba(0,0,0,.9);
  box-shadow: 0 10px 22px rgba(0,0,0,.55), inset 0 -1px 0 rgba(201,168,106,.08);
}
.fb-row { display: flex; align-items: center; gap: 6px; min-height: 32px; position: relative; }
.fb-row + .fb-row { margin-top: 3px; }
.fb-labels .fb-scroll { padding-right: 16px; }
.fb-labels::after {
  content: ""; position: absolute; top: 2px; bottom: 2px; right: 0; width: 24px;
  pointer-events: none;
  background: linear-gradient(90deg, rgba(11,8,6,0), rgba(11,8,6,.94));
}
.fb-scroll {
  flex: 1; min-width: 0;
  display: flex; align-items: center; gap: 5px;
  overflow-x: auto; overflow-y: hidden;
  scrollbar-width: none; -webkit-overflow-scrolling: touch;
}
.fb-scroll::-webkit-scrollbar { display: none; }
.fb-cap {
  flex: 0 0 auto; padding-left: 3px; font-size: 6.5px; letter-spacing: .22em;
  text-transform: uppercase; color: #8f7750;
}
.fb-div { flex: 0 0 auto; width: 1px; height: 16px; background: rgba(201,168,106,.22); }
.chip {
  position: relative; flex: 0 0 auto;
  display: inline-flex; align-items: center; gap: 5px;
  height: 31px; padding: 0 9px; border-radius: 16px;
  font-family: var(--body); font-size: 9.5px; letter-spacing: .04em; white-space: nowrap;
  color: var(--paper-dim);
  border: 1px solid rgba(201,168,106,.26);
  background: rgba(22,16,11,.55);
  transition: transform 160ms var(--ease-io);
}
.chip:active { transform: scale(.96); }
.chip .dot {
  width: 7px; height: 7px; border-radius: 50%; display: inline-block;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.3), 0 0 0 1px rgba(0,0,0,.4);
}
.chip .dot.status-dot { border-radius: 1px; }
.chip[aria-pressed="true"] {
  color: #1a1309;
  background: linear-gradient(180deg, var(--brass-hi), var(--brass));
  border-color: #d8bc85;
}
.chip[aria-pressed="true"] .dot { box-shadow: 0 0 0 1px rgba(40,28,12,.55); }
.chip.clear { color: #d8b9a8; border-color: rgba(138,90,90,.5); background: rgba(74,38,33,.42); }
.chip.clear::before { content: "×"; font-size: 13px; line-height: 1; }
.fb-count {
  flex: 0 0 auto; display: flex; align-items: baseline; gap: 3px;
  padding: 0 4px 0 8px; border-left: 1px solid rgba(201,168,106,.22);
  font-size: 6.5px; letter-spacing: .14em; text-transform: uppercase; color: #9b8154;
}
.fb-count b { font-family: var(--display); font-size: 14px; font-weight: 400; letter-spacing: .02em; color: #c9ac79; }

/* ============================================================
   2. The Victorian case
   ============================================================ */
.case {
  position: relative; margin: 18px 10px 22px;
  padding: 0;
  border-left: 1px solid rgba(201,168,106,.14);
  border-right: 1px solid rgba(201,168,106,.14);
  background: linear-gradient(180deg, var(--wood-2), var(--wood-1) 60%, var(--wood-0));
  box-shadow:
    0 28px 54px rgba(0,0,0,.8),
    0 4px 12px rgba(0,0,0,.6),
    inset 0 0 0 1px rgba(255,226,180,.035);
}

/* --- crown ------------------------------------------------- */
.case-crown { position: relative; z-index: 5; }
.crown-cap {
  height: 9px; margin: 0 5px; border-radius: 3px 3px 0 0;
  background: linear-gradient(180deg, #5f462c 0%, #3a2919 55%, #241810 100%);
  box-shadow: inset 0 1px 0 rgba(255,231,190,.34), inset 0 -1px 0 rgba(0,0,0,.55), 0 2px 5px rgba(0,0,0,.55);
}
.crown-frieze {
  position: relative; height: 27px; margin: 0;
  display: grid; place-items: center;
  background:
    linear-gradient(180deg, rgba(255,226,180,.08), transparent 30%),
    linear-gradient(180deg, #3d2c1c 0%, #2a1d12 62%, #1a120b 100%);
  box-shadow: inset 0 1px 0 rgba(255,226,180,.2), inset 0 -2px 3px rgba(0,0,0,.6), 0 3px 7px rgba(0,0,0,.45);
}
.crown-frieze::before {
  content: ""; position: absolute; left: 10px; right: 10px; top: 4px; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(201,168,106,.42), transparent);
}
.crown-frieze::after {
  content: ""; position: absolute; left: 10px; right: 10px; bottom: 4px; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(201,168,106,.22), transparent);
}
.crown-frieze svg { width: 138px; height: 20px; color: #a88755; opacity: .85; }
.crown-mould {
  position: relative; height: 9px; margin: 0 2px;
  background: linear-gradient(180deg, #584027 0%, #3b2a1a 45%, #241810 100%);
  box-shadow: inset 0 1px 0 rgba(255,231,190,.34), 0 2px 4px rgba(0,0,0,.5);
}
.crown-mould::after {
  content: ""; position: absolute; left: 7px; right: 7px; top: -5px; height: 4px;
  background: repeating-linear-gradient(90deg, rgba(201,168,106,.34) 0 2px, rgba(0,0,0,.3) 2px 3px, transparent 3px 8px);
  opacity: .7;
}

/* --- frame + pilasters ------------------------------------- */
.case-frame { position: relative; display: flex; align-items: stretch; }
.case-bays { flex: 1; min-width: 0; }

.pilaster {
  position: relative; flex: 0 0 17px; width: 17px; z-index: 6;
  background:
    repeating-linear-gradient(90deg, rgba(255,226,180,.10) 0 1px, transparent 1px 3px, rgba(0,0,0,.4) 3px 4px, transparent 4px 7px),
    linear-gradient(180deg, #42301e 0%, #2d2014 48%, #1b120c 100%);
  box-shadow: inset 1px 0 0 rgba(255,226,180,.12), inset -2px 0 4px rgba(0,0,0,.55);
}
.pilaster::before, .pilaster::after {
  content: ""; position: absolute; left: -3px; right: -3px; z-index: 2;
  background: linear-gradient(180deg, #503a25 0%, #332316 48%, #211710 100%);
  box-shadow: inset 0 1px 0 rgba(255,231,190,.32), inset 0 -1px 0 rgba(0,0,0,.5), 0 3px 6px rgba(0,0,0,.5);
}
.pilaster::before { top: 0; height: 19px; border-radius: 2px 2px 1px 1px; border-top: 1px solid rgba(201,168,106,.24); }
.pilaster::after { bottom: 0; height: 23px; border-radius: 1px 1px 2px 2px; border-bottom: 1px solid rgba(201,168,106,.2); }
.pilaster i {
  position: absolute; left: -2px; right: -2px; height: 1px; z-index: 3;
  background: linear-gradient(90deg, transparent, rgba(201,168,106,.45), transparent);
}
.pilaster i.a { top: 21px; }
.pilaster i.b { bottom: 25px; }

/* --- one bay ----------------------------------------------- */
.bay { position: relative; }
.bay-cavity {
  position: relative; height: 244px; overflow: hidden;
  background:
    radial-gradient(94% 62% at 50% 0%, rgba(176,141,87,.10), transparent 64%),
    linear-gradient(180deg, #19120c 0%, #100a07 64%, #090604 100%);
  box-shadow:
    inset 0 20px 34px rgba(0,0,0,.92),
    inset 0 0 0 1px rgba(201,168,106,.055),
    inset 14px 0 24px -16px rgba(0,0,0,.95),
    inset -14px 0 24px -16px rgba(0,0,0,.95);
}
.bay-cavity::before {
  content: ""; position: absolute; z-index: 0; inset: 8px 10px; pointer-events: none;
  border: 1px solid rgba(176,141,87,.075);
  background:
    linear-gradient(90deg,
      transparent 32.6%, rgba(0,0,0,.34) 32.6% 33.1%, rgba(255,226,180,.035) 33.1% 33.5%, transparent 33.5%,
      transparent 66.1%, rgba(0,0,0,.34) 66.1% 66.6%, rgba(255,226,180,.035) 66.6% 67%, transparent 67%),
    linear-gradient(180deg,
      transparent 35%, rgba(0,0,0,.26) 35% 35.5%, rgba(255,226,180,.03) 35.5% 35.9%, transparent 35.9%,
      transparent 78%, rgba(0,0,0,.24) 78% 78.5%, rgba(255,226,180,.03) 78.5% 78.9%, transparent 78.9%);
  box-shadow: inset 1px 1px 0 rgba(255,230,190,.04), inset -1px -1px 0 rgba(0,0,0,.55);
}
.bay-lamp {
  position: absolute; z-index: 1; top: -28px; left: 50%; width: 94%; height: 172px;
  transform: translateX(-50%); pointer-events: none;
  background: radial-gradient(ellipse at 50% 18%, rgba(201,168,106,.20), rgba(176,141,87,.06) 45%, transparent 72%);
}
.bay-books {
  position: absolute; z-index: 2; left: 4px; right: 4px; top: 0; bottom: 0;
  display: flex; align-items: flex-end; justify-content: space-between; gap: 1px;
}
.brass-rail {
  position: absolute; z-index: 3; left: 5px; right: 5px; bottom: 2px; height: 3px; border-radius: 1px;
  background: linear-gradient(90deg, #6d5330, #c9a86a 16%, #8a6b3e 52%, #c9a86a 84%, #6d5330);
  box-shadow: 0 1px 2px rgba(0,0,0,.85), inset 0 1px 0 rgba(255,240,200,.5);
  pointer-events: none;
}
.brass-rail::before, .brass-rail::after {
  content: ""; position: absolute; top: -3px; width: 4px; height: 9px; border-radius: 2px;
  background: linear-gradient(180deg, #d3b47a, #7d6238);
  box-shadow: 0 1px 2px rgba(0,0,0,.7);
}
.brass-rail::before { left: -2px; }
.brass-rail::after { right: -2px; }

/* --- shelf board, lip, corbels ----------------------------- */
.bay-shelf { position: relative; height: 27px; z-index: 4; }
.shelf-lip {
  position: absolute; top: 0; left: 2px; right: 2px; height: 9px; border-radius: 2px;
  background: linear-gradient(180deg, #5f462c 0%, #3e2c1b 52%, #261a10 100%);
  box-shadow:
    inset 0 1px 0 rgba(255,231,190,.38),
    inset 0 -1px 0 rgba(0,0,0,.55),
    0 2px 4px rgba(0,0,0,.5);
}
.shelf-lip::after {
  content: ""; position: absolute; left: 8px; right: 8px; top: 4px; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(201,168,106,.36) 18%, rgba(201,168,106,.1) 52%, rgba(201,168,106,.32) 84%, transparent);
}
.shelf-board {
  position: absolute; inset: 7px 0 0;
  background: linear-gradient(180deg, #4a3521 0%, #332316 34%, #1f150d 72%, #120c07 100%);
  box-shadow:
    inset 0 1px 0 rgba(255,226,180,.22),
    0 12px 18px rgba(0,0,0,.72),
    0 2px 0 #0b0704;
}
.shelf-board::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: 3px; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(201,168,106,.18), transparent);
}
.corbel {
  position: absolute; top: 22px; width: 28px; height: 22px; z-index: 3;
  color: #3a2919; pointer-events: none;
  filter: none;
}
.corbel svg { width: 100%; height: 100%; overflow: visible; }
.corbel.l { left: 1px; }
.corbel.r { right: 1px; transform: scaleX(-1); }

.shelf-plate, .shelf-full {
  position: absolute; z-index: 7; top: 10px;
  font-size: 6px; letter-spacing: .18em; text-transform: uppercase;
  color: #efe0bb; padding: 2px 7px; border-radius: 1px;
  background: linear-gradient(180deg, #b08d57 0%, #8a6a3c 55%, #6b5129 100%);
  box-shadow: inset 0 1px 0 rgba(255,246,214,.55), inset 0 -1px 0 rgba(0,0,0,.45), 0 1px 3px rgba(0,0,0,.6);
  text-shadow: 0 1px 0 rgba(60,40,12,.55);
}
.shelf-plate { left: 10px; }
.shelf-full { right: 10px; letter-spacing: .1em; color: #f5e7c4; }

/* --- empty shelf ------------------------------------------- */
.bay.empty .bay-cavity { height: 178px; display: grid; place-items: center; }
.bay.empty .bay-cavity::before { opacity: .55; }
.empty-note {
  position: relative; z-index: 2; text-align: center; padding: 14px 22px;
  color: #9b8154;
  border: 1px solid rgba(176,141,87,.3);
  background: linear-gradient(180deg, rgba(20,14,9,.85), rgba(10,7,5,.9));
  box-shadow: inset 0 0 26px rgba(0,0,0,.7), 0 2px 6px rgba(0,0,0,.5);
}
.empty-note::before, .empty-note::after {
  content: ""; position: absolute; left: 8px; right: 8px; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(201,168,106,.28), transparent);
}
.empty-note::before { top: 4px; }
.empty-note::after { bottom: 4px; }
.empty-note .e1 { display: block; font-family: var(--display); font-size: 13px; letter-spacing: .2em; text-transform: uppercase; color: #c2a26c; }
.empty-note .e2 { display: block; margin-top: 5px; font-size: 7px; letter-spacing: .24em; text-transform: uppercase; }

/* --- plinth ------------------------------------------------ */
.case-plinth { position: relative; z-index: 5; }
.plinth-top {
  height: 8px; margin: 0 -1px;
  background: linear-gradient(180deg, #5a422a 0%, #3a2919 60%, #241810 100%);
  box-shadow: inset 0 1px 0 rgba(255,231,190,.28), 0 2px 4px rgba(0,0,0,.5);
}
.plinth-body {
  height: 22px; margin: 0 4px;
  background:
    repeating-linear-gradient(90deg, rgba(255,226,180,.035) 0 1px, transparent 1px 9px),
    linear-gradient(180deg, #2e2014 0%, #1c130c 62%, #100a06 100%);
  box-shadow: inset 0 1px 0 rgba(255,226,180,.12), inset 0 -2px 4px rgba(0,0,0,.65), 0 12px 20px rgba(0,0,0,.6);
}
.plinth-foot { height: 5px; margin: 0 1px; background: #090604; box-shadow: 0 6px 12px rgba(0,0,0,.7); }

/* ============================================================
   3. Books / spines
   ============================================================ */
.book {
  position: relative; display: block; flex: 0 0 auto;
  width: var(--w); height: var(--h); border-radius: 2px 2px 1px 1px;
  transform: rotate(var(--lean)); transform-origin: 50% 100%;
  transition: transform var(--dur-lift) var(--ease-out), opacity 220ms var(--ease-io);
}
.book:focus-visible { outline: 2px solid var(--brass-hi); outline-offset: 2px; }
.book:active { transform: rotate(var(--lean)) translateY(-4px); }
.book.is-out { opacity: 0; pointer-events: none; }
.book.is-dim { opacity: .16; pointer-events: none; }
.spine {
  position: relative; display: block; width: 100%; height: 100%; overflow: hidden;
  border-radius: 2px 2px 1px 1px;
  background:
    linear-gradient(90deg,
      rgba(0,0,0,.62) 0%, rgba(0,0,0,.14) 9%, rgba(255,255,255,.11) 26%,
      rgba(255,255,255,.015) 46%, rgba(0,0,0,.14) 74%, rgba(0,0,0,.6) 96%, rgba(0,0,0,.76) 100%),
    repeating-linear-gradient(90deg, rgba(255,255,255,.028) 0 1px, transparent 1px 3px),
    linear-gradient(180deg, var(--c1) 0%, var(--c2) 100%);
  box-shadow:
    inset 0 1px 0 rgba(255,235,190,.16),
    inset 0 9px 11px -9px rgba(0,0,0,.9),
    inset 0 -14px 16px -11px rgba(0,0,0,.95),
    inset 0 13px 0 -12px var(--gold),
    inset 0 -17px 0 -16px var(--gold),
    1px 0 0 rgba(0,0,0,.5),
    0 7px 10px -3px rgba(0,0,0,.7);
}
.spine::before {
  content: ""; position: absolute; z-index: 1; inset: 0; pointer-events: none;
  background:
    linear-gradient(180deg, rgba(255,255,255,.055), transparent 9%, transparent 86%, rgba(0,0,0,.36)),
    radial-gradient(140% 16% at 50% 100%, rgba(255,235,190,.08), transparent 70%);
}
.spine-rule {
  position: absolute; z-index: 3; left: 4px; right: 4px; height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent); opacity: .58;
}
.spine-rule.top { top: 13px; }
.spine-rule.bottom { bottom: 17px; opacity: .46; }
.spine-text {
  position: absolute; z-index: 3; left: 0; right: 0; top: 19px; bottom: 54px;
  display: flex; flex-direction: column; align-items: center; gap: 4px; overflow: hidden;
}
.st, .sa {
  writing-mode: vertical-rl; text-orientation: mixed;
  max-width: 100%; overflow: hidden; white-space: nowrap;
  text-shadow: 0 1px 1px rgba(0,0,0,.8);
}
.st {
  font-family: var(--display); font-size: var(--fs); letter-spacing: .04em;
  color: var(--ink); max-height: calc(100% - 22px);
}
.sa {
  font-size: 5.6px; letter-spacing: .12em; text-transform: uppercase;
  color: var(--ink); opacity: .7; max-height: 34px; flex: 0 0 auto;
}
.bands {
  position: absolute; z-index: 5; left: 2px; right: 2px; bottom: 5px;
  display: flex; flex-direction: column; gap: 2px;
}
.lb {
  height: 10px; line-height: 10px; padding: 0 1px; border-radius: 1px;
  font-size: 4.9px; letter-spacing: .015em; text-transform: uppercase;
  text-align: center; white-space: nowrap; overflow: hidden;
  color: var(--li); background: var(--lc);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.18), 0 1px 1px rgba(0,0,0,.55);
}
.lb.more { background: #cbb891; color: #2a2118; }
.seal {
  position: absolute; z-index: 5; left: 50%; bottom: 42px; width: 14px; height: 14px;
  transform: translateX(-50%); border-radius: 50%;
  font-family: var(--display); font-size: 6.5px; line-height: 14px; text-align: center;
  color: #4c3110;

  text-shadow: 0 1px 0 rgba(255,244,198,.6);

.ribbon {
  position: absolute; z-index: 6; top: -5px; right: 3px; width: 7px; height: 36px;
  background: linear-gradient(90deg, #471014 0%, #7c2628 38%, #a34a45 52%, #6d2022 78%, #3c0c0f 100%);

  clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 82%, 0 100%);

.ribbon::after {
  content: ""; position: absolute; inset: 0 0 auto 0; height: 2px; background: rgba(255,205,180,.22);
}
@media (hover: hover) {
  .book:hover { transform: rotate(var(--lean)) translateY(-3px); }
}

/* Keep 12 volumes inside the case on narrower phones. */
@media (max-width: 374px) {
  .book { width: calc(var(--w) * .9); }
}
@media (max-width: 344px) {
  .book { width: calc(var(--w) * .8); }
}

/* ============================================================
   4. Detail — framed panel with the real cover as hero
   ============================================================ */
.detail {
  position: fixed; inset: 0; z-index: 500;
  overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
}
.scrim {
  position: fixed; inset: 0; z-index: 0; opacity: 0;
  background:
    radial-gradient(80% 46% at 50% 16%, rgba(53,37,24,.42), transparent 62%),
    radial-gradient(100% 80% at 50% 108%, #020302, transparent 66%),
    rgba(4,3,2,.987);
  transition: opacity var(--dur-fade) var(--ease-io);
}
.detail.is-open .scrim { opacity: 1; }
.close {
  position: fixed; z-index: 20; top: max(13px, env(safe-area-inset-top)); right: 13px;
  width: 44px; height: 44px; border-radius: 50%;
  display: grid; place-items: center; font-size: 23px; line-height: 1;
  color: var(--brass-hi);
  background: linear-gradient(180deg, #2a1d12, #120c07);
  border: 1px solid rgba(201,168,106,.45);
  box-shadow: inset 0 1px 0 rgba(255,235,190,.18), 0 6px 14px rgba(0,0,0,.6);
  transition: transform 180ms var(--ease-io);
}
.close:active { transform: scale(.9); }

.d4-wrap {
  position: relative; z-index: 2;
  max-width: 390px; margin: 0 auto;
  padding: 60px 12px 36px;
}
.detail-stage {
  position: relative;
  perspective: 1300px;
  perspective-origin: 50% 26%;
  transform-style: preserve-3d;
  /* verification contract: stage stays flat and unclipped */
  overflow: visible; opacity: 1; filter: none; clip-path: none;
}
.panel {
  position: relative;
  padding: 21px 16px 19px;
  border: 1px solid rgba(201,168,106,.58);
  background:
    radial-gradient(88% 24% at 50% 0%, rgba(176,141,87,.13), transparent 62%),
    repeating-linear-gradient(90deg, rgba(255,226,180,.018) 0 1px, transparent 1px 7px),
    linear-gradient(180deg, #17110c 0%, #100b08 55%, #0a0705 100%);
  box-shadow:
    0 30px 60px rgba(0,0,0,.72),
    inset 0 0 54px rgba(0,0,0,.6),
    0 0 34px rgba(176,141,87,.05);
  transform-origin: 50% 50%;
  opacity: 0;
  transform: rotateY(-11deg) translateY(18px) scale(.975);
  transition: transform var(--dur-open) var(--ease-out), opacity var(--dur-fade) var(--ease-out);
  will-change: transform, opacity;
}
.detail.is-open .panel { opacity: 1; transform: rotateY(0) translateY(0) scale(1); }
.detail.is-closing .panel {
  opacity: 0; transform: rotateY(5deg) translateY(10px) scale(.985);
  transition: transform var(--dur-exit) var(--ease-io), opacity 240ms var(--ease-io);
}
.panel::before {
  content: ""; position: absolute; inset: 5px; pointer-events: none;
  border: 1px solid rgba(201,168,106,.22);
}
.panel::after {
  content: ""; position: absolute; inset: 9px; pointer-events: none;
  border: 1px solid rgba(201,168,106,.08);
}
.corner {
  position: absolute; width: 17px; height: 17px; z-index: 4; pointer-events: none;
  border-color: rgba(201,168,106,.72); border-style: solid;
}
.corner.tl { top: 7px; left: 7px; border-width: 1px 0 0 1px; }
.corner.tr { top: 7px; right: 7px; border-width: 1px 1px 0 0; }
.corner.bl { bottom: 7px; left: 7px; border-width: 0 0 1px 1px; }
.corner.br { bottom: 7px; right: 7px; border-width: 0 1px 1px 0; }

.panel-crest { display: block; width: 124px; height: 22px; margin: 0 auto 8px; color: #a88755; opacity: .9; }
.panel-kicker {
  margin: 0 0 13px; text-align: center; font-size: 6.8px; letter-spacing: .3em;
  text-transform: uppercase; color: #9b8154;
}

.cover-stage {
  position: relative;
  width: min(calc(73% + 23px), 270px);
  margin: 0 auto 20px;
}
.cover-halo {
  position: absolute; left: 50%; top: -13px; width: 108%; height: calc(100% + 22px);
  transform: translateX(-50%); pointer-events: none;
  border: 1px solid rgba(201,168,106,.22);
  border-radius: 42% 42% 2px 2px / 14% 14% 2px 2px;
  box-shadow: 0 0 26px rgba(176,141,87,.06);
}
.cover-hero {
  position: relative;
  aspect-ratio: 2 / 3;
  border-radius: 2px 4px 4px 2px;
  background: #1a120c;
  box-shadow:
    0 20px 36px rgba(0,0,0,.66),
    0 2px 0 rgba(0,0,0,.55),
    inset 0 0 0 1px rgba(255,235,190,.14);
}
.cover-hero img {
  width: 100%; height: 100%; object-fit: cover;
  border-radius: 2px 4px 4px 2px;
}
.cover-fold {
  position: absolute; z-index: 2; top: 0; bottom: 0; left: 0; width: 11px;
  border-radius: 2px 0 0 2px; pointer-events: none;
  background: linear-gradient(90deg, rgba(0,0,0,.6), rgba(0,0,0,.12) 45%, rgba(255,255,255,.10) 68%, transparent);
  box-shadow: inset 1px 0 0 rgba(255,235,190,.12);
}
.cover-pages {
  position: absolute; z-index: -1; top: 4px; bottom: 4px; right: -5px; width: 6px;
  border-radius: 0 2px 2px 0; pointer-events: none;
  background: repeating-linear-gradient(180deg, #cdbfa4 0 1px, #9d8d72 1px 2px, #b7a78a 2px 3px);
  box-shadow: 1px 0 3px rgba(0,0,0,.6);
}
.cover-bottom-pages {
  position: absolute; z-index: -1; left: 5px; right: -4px; bottom: -5px; height: 6px;
  border-radius: 0 0 3px 3px; pointer-events: none;
  background: repeating-linear-gradient(90deg, #c3b397 0 1px, #948468 1px 2px, #b3a386 2px 3px);
  box-shadow: 0 1px 3px rgba(0,0,0,.55);
}
.cover-sticker {
  position: absolute; z-index: 5; right: -12px; bottom: -13px;
  transform: rotate(-6deg);
}
.paper-sticker {
  width: 62px; height: 62px; padding: 6px; border-radius: 2px;

  background: radial-gradient(120% 100% at 20% 8%, #f5edd7, #e3d5b6 72%, #cdbc98 100%);

.paper-sticker::after {

}

.gold-sticker {

  content: ""; position: absolute; inset: 8px; border-radius: 50%; border: 1px dashed rgba(92,62,14,.45);
}
.gold-sticker .gstar { font-size: 13px; line-height: 1; }

.progress .bar { display: block; height: 3px; background: rgba(201,168,106,.16); }
.progress .bar i { display: block; height: 100%; background: linear-gradient(90deg, #7d6238, #c9a86a); }

.hint { margin: 12px 0 0; text-align: center; font-size: 6.6px; letter-spacing: .22em; text-transform: uppercase; color: #7d6844; }

/* flight clone */
.flight {

    ["The Voyage of the Beagle", "Charles Darwin", 1839, ["travel", "essays"], "unread", 0, "voyage-of-the-beagle", "#4f493d", "#221f19",
      "Darwin's five-year voyage of observation, from Brazilian forest to Galápagos rock, in his own generous prose."],
    ["The Old Curiosity Shop", "Charles Dickens", 1841, ["essays"], "finished", 100, "old-curiosity-shop", "#453727", "#1d160f",
      "Little Nell and her grandfather flee a shop of curiosities, pursued by debt and the grotesque Quilp."],
    ["David Copperfield", "Charles Dickens", 1850, ["essays"], "reading", 61, "david-copperfield", "#5d432a", "#291c10",
      "A boy is sent from a loving home into a cruel counting-house, and must make his way through London's fog, friendship and loss."],
    ["The Mill on the Floss", "George Eliot", 1860, ["essays"], "unread", 0, "mill-on-the-floss", "#51452f", "#231d13",
      "Maggie Tulliver's fierce mind and restless heart collide with the narrow expectations of a Lincolnshire mill town."],
    ["Tess of the d'Urbervilles", "Thomas Hardy", 1891, ["essays"], "unread", 0, "tess", "#4b4435", "#201b14",
      "A country girl is sent to claim a family name and returns with a ruin that Victorian England will not let her forget."],
    ["The Return of the Native", "Thomas Hardy", 1878, ["poetry", "essays"], "reading", 8, "return-of-the-native", "#5e4a30", "#291f12",
      "Clym Yeobright returns from Paris to Egdon Heath, where desire, rumour and the weather work against every plan."],
    ["Mansfield Park", "Jane Austen", 1814, ["essays"], "unread", 0, "mansfield-park", "#4e3e27", "#21170e",
      "Fanny Price grows up in a grand house as a poor relation, watching a fashionable world test every value she holds."],
    ["Northanger Abbey", "Jane Austen", 1817, ["gothic", "poetry"], "finished", 100, "northanger-abbey", "#4a4a4a", "#1f1f1f",
      "Catherine Morland takes a taste for Gothic novels to Bath, and finds that real life is stranger and kinder than her books."],
    ["Sense and Sensibility", "Jane Austen", 1811, ["essays", "poetry"], "unread", 0, "sense-and-sensibility", "#5b4525", "#281d0f",
      "Two sisters weather love and ruin with sense and sensibility, learning how much of each the other needs."]
  ];

  const dims = [
    [222, 25], [234, 27], [226, 24], [238, 26], [214, 28], [230, 25],
    [220, 27], [232, 24], [218, 26], [228, 25], [224, 27], [236, 23],
    [216, 26], [233, 25], [229, 27], [221, 24], [235, 26], [212, 28],
    [227, 25], [219, 27], [231, 24], [223, 26], [237, 25], [215, 27],
    [230, 24], [218, 26], [234, 25], [222, 27], [228, 24], [236, 26],
    [217, 28], [225, 25], [232, 26], [220, 24], [226, 27], [238, 25]
  ];

  const books = RAW.map((row, i) => {
    const [title, author, year, labels, status, progress, cover, c1, c2, blurb] = row;
    return {
      id: "b" + (i + 1),
      title, author, year, labels, status, progress, cover, blurb,
      shelf: Math.floor(i / 12),
      h: dims[i][0],
      w: dims[i][1],
      lean: (i % 13 === 5 ? -1.4 : i % 17 === 9 ? 1.1 : 0),
      c1, c2,
      fs: dims[i][1] < 25 ? "8.1px" : dims[i][1] > 27 ? "9.2px" : "8.7px",
      format: i % 7 === 0 ? "PDF" : "EPUB"
    };
  });

  const byId = Object.fromEntries(books.map(b => [b.id, b]));
  const SHELVES = [0, 1, 2].map(si => ({
    index: si,
    capacity: 12,
    books: books.filter(b => b.shelf === si)
  }));

  const state = { open: null, label: null, status: null };
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const app = document.getElementById("app");
  const detailRoot = document.getElementById("detail-root");

  /* ---------------------------------------------------------
     Helpers
     --------------------------------------------------------- */
  const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  function spineTitle(b) {
    const fs = parseFloat(b.fs);
    const avail = Math.max(52, b.h - 20 - 56 - 26);
    const maxChars = Math.max(8, Math.floor(avail / (fs * 0.54)));
    if (b.title.length <= maxChars) return b.title;
    const cut = b.title.slice(0, Math.max(4, maxChars - 1));
    const sp = cut.lastIndexOf(" ");
    const keep = sp > maxChars * 0.5 ? cut.slice(0, sp) : cut;
    return keep.replace(/[\s,.;:]+$/, "") + "…";
  }
  const surname = (a) => a.trim().split(/\s+/).slice(-1)[0];

  function spineHTML(b) {
    const labelBands = b.labels.slice(0, 2).map(k => {
      const L = LABELS[k];
      return `<span class="lb" style="--lc:${L.color};--li:${L.ink}">${esc(L.abbr)}</span>`;
    }).join("");
    const more = b.labels.length > 2 ? `<span class="lb more">+${b.labels.length - 2}</span>` : "";
    const ribbon = b.status === "reading" ? `<span class="ribbon" aria-hidden="true"></span>` : "";
    const seal = b.status === "finished" ? `<span class="seal" aria-hidden="true">✦</span>` : "";
    return `
      <button class="book" data-id="${b.id}" style="--w:${b.w}px;--h:${b.h}px;--c1:${b.c1};--c2:${b.c2};--gold:#b08d57;--ink:#efe3c9;--lean:${b.lean}deg;--fs:${b.fs}"
        aria-label="${esc(b.title)} by ${esc(b.author)}. ${STATUS_LABEL[b.status]}${b.labels.length ? ", labels " + b.labels.map(k => LABELS[k].name).join(", ") : ""}">
        <span class="spine">
          <span class="spine-rule top" aria-hidden="true"></span>
          <span class="spine-text">
            <span class="st">${esc(spineTitle(b))}</span>
            <span class="sa">${esc(surname(b.author))}</span>
          </span>
          <span class="spine-rule bottom" aria-hidden="true"></span>
          ${seal}
          <span class="bands">${labelBands}${more}</span>
        </span>
        ${ribbon}
      </button>`;
  }

  function bayHTML(s) {
    const last = s.index === 2;
    return `
      <section class="bay" aria-label="Shelf ${ROMAN[s.index]}, ${s.books.length} volumes${last ? ", full" : ""}">
        <div class="bay-cavity">
          <div class="bay-lamp" aria-hidden="true"></div>
          <div class="bay-books">${s.books.map(spineHTML).join("")}</div>
          <div class="brass-rail" aria-hidden="true"></div>
        </div>
        <div class="bay-shelf">
          <div class="shelf-lip" aria-hidden="true"></div>
          <div class="shelf-board" aria-hidden="true"></div>
          <span class="shelf-plate">Shelf ${ROMAN[s.index]}</span>
          ${last ? `<span class="shelf-full">Full · ${s.books.length}/${s.capacity}</span>` : ""}
          <span class="corbel l" aria-hidden="true"><svg><use href="#orn-bracket"/></svg></span>
          <span class="corbel r" aria-hidden="true"><svg><use href="#orn-bracket"/></svg></span>
        </div>
      </section>`;
  }

  function emptyBayHTML() {
    return `
      <section class="bay empty" aria-label="Shelf IV, empty">
        <div class="bay-cavity">
          <div class="bay-lamp" aria-hidden="true"></div>
          <div class="empty-note">
            <span class="e1">Shelf IV</span>
            <span class="e2">Awaiting its first volume</span>
          </div>
          <div class="brass-rail" aria-hidden="true"></div>
        </div>
        <div class="bay-shelf">
          <div class="shelf-lip" aria-hidden="true"></div>
          <div class="shelf-board" aria-hidden="true"></div>
          <span class="shelf-plate">Shelf IV</span>
          <span class="corbel l" aria-hidden="true"><svg><use href="#orn-bracket"/></svg></span>
          <span class="corbel r" aria-hidden="true"><svg><use href="#orn-bracket"/></svg></span>
        </div>
      </section>`;
  }

  function filterHTML() {
    const labels = Object.entries(LABELS).map(([k, L]) =>
      `<button type="button" class="chip" data-label="${k}" aria-pressed="false">
        <span class="dot" style="background:${L.color}" aria-hidden="true"></span>${esc(L.name)}</button>`).join("");
    const statuses = ["unread", "reading", "finished"].map(s => {
      const col = s === "reading" ? "#8a4a44" : s === "finished" ? "#a8874f" : "#7a7365";
      return `<button type="button" class="chip" data-status="${s}" aria-pressed="false">
        <span class="dot status-dot" style="background:${col}" aria-hidden="true"></span>${STATUS_LABEL[s]}</button>`;
    }).join("");
    return `
      <div class="filterbar" role="toolbar" aria-label="Filter shelves">
        <div class="fb-row fb-labels">
          <div class="fb-scroll">
            ${labels}
            <button type="button" class="chip clear" data-clear hidden aria-label="Clear filters">Clear</button>
          </div>
        </div>
        <div class="fb-row">
          <span class="fb-cap">Status</span>
          <div class="fb-scroll">${statuses}</div>
          <div class="fb-count" aria-live="polite"><b data-count>36</b><span>vols</span></div>
        </div>
      </div>`;
  }

  function roomHTML() {
    return `
      <div class="room">
        <header class="mast">
          <p class="kicker">Bibliotheca Domestica</p>
          <h1>Pocket Library</h1>
          <div class="orn" aria-hidden="true"><svg><use href="#orn-fleuron"/></svg></div>
          <p class="sub">The Reading Room · Thirty-six Volumes</p>
        </header>
        ${filterHTML()}
        <main class="case" aria-label="Victorian bookcase">
          <div class="case-crown" aria-hidden="true">
            <div class="crown-cap"></div>
            <div class="crown-frieze"><svg><use href="#orn-crest"/></svg></div>
            <div class="crown-mould"></div>
          </div>
          <div class="case-frame">
            <div class="pilaster" aria-hidden="true"><i class="a"></i><i class="b"></i></div>
            <div class="case-bays">
              ${SHELVES.map(bayHTML).join("")}
              ${emptyBayHTML()}
            </div>
            <div class="pilaster" aria-hidden="true"><i class="a"></i><i class="b"></i></div>
          </div>
          <div class="case-plinth" aria-hidden="true">
            <div class="plinth-top"></div>
            <div class="plinth-body"></div>
            <div class="plinth-foot"></div>
          </div>
        </main>
      </div>`;
  }

  function stickerHTML(b) {
    if (b.status === "reading") {
      return `<span class="cover-sticker" aria-label="Reading progress ${b.progress} percent">
        <span class="paper-sticker"><span class="pct">${b.progress}<i>%</i></span><span class="psub">read</span></span>
      </span>`;
    }
    if (b.status === "finished") {
      return `<span class="cover-sticker" aria-label="Finished">
        <span class="gold-sticker"><span class="gstar">✦</span><span class="gsub">Finished</span></span>
      </span>`;
    }
    return "";
  }

  function progressHTML(b) {
    if (b.status !== "reading") return "";
    return `<div class="progress">
      <div class="p-cap"><span>Progress</span><span>${b.progress}%</span></div>
      <span class="bar"><i style="width:${b.progress}%"></i></span>
    </div>`;
  }

  function detailHTML(b) {
    const volume = String((books.indexOf(b) % 12) + 1).padStart(2, "0");
    return `
      <div class="detail d4" role="dialog" aria-modal="true" aria-label="${esc(b.title)} — book details">
        <div class="scrim" data-close></div>
        <button type="button" class="close" data-close aria-label="Return to shelf">×</button>
        <div class="d4-wrap">
          <div class="detail-stage">
            <article class="panel">
              <span class="corner tl" aria-hidden="true"></span><span class="corner tr" aria-hidden="true"></span>
              <span class="corner bl" aria-hidden="true"></span><span class="corner br" aria-hidden="true"></span>
              <svg class="panel-crest" aria-hidden="true"><use href="#orn-crest"/></svg>
              <p class="panel-kicker">From Shelf ${ROMAN[b.shelf]} · Volume ${volume}</p>

              <div class="cover-stage">
                <div class="cover-halo" aria-hidden="true"></div>
                <div class="cover-hero">
                  <img src="covers/${b.cover}.jpg" alt="Front cover of ${esc(b.title)} by ${esc(b.author)}" width="900" height="1350">
                  <span class="cover-fold" aria-hidden="true"></span>
                  <span class="cover-pages" aria-hidden="true"></span>
                  <span class="cover-bottom-pages" aria-hidden="true"></span>
                </div>
                ${stickerHTML(b)}
              </div>

              <h2>${esc(b.title)}</h2>
              <p class="byline">${esc(b.author)} · ${b.year}</p>
              <div class="orn-rule" aria-hidden="true"><svg width="22" height="8" viewBox="0 0 72 20"><use href="#orn-fleuron"/></svg></div>
              <p class="blurb">${esc(b.blurb)}</p>
              ${progressHTML(b)}

              <div class="statusline">
                <div class="sl-left">
                  <span class="sl-cap">Reading status</span>
                  <span class="status-pill" data-status="${b.status}">${STATUS_LABEL[b.status]}</span>
                </div>
              </div>

              <div class="dlabels">
                ${b.labels.map(k => {
                  const L = LABELS[k];
                  return `<span class="dlabel" style="--lc:${L.color};--li:${L.ink}">${esc(L.name)}</span>`;
                }).join("")}
              </div>

              <div class="meta-strip">
                <span><em>Edition</em><b>${b.year}</b></span>
                <span><em>Shelf</em><b>${ROMAN[b.shelf]}</b></span>
                <span><em>Format</em><b>${b.format}</b></span>
                <span><em>Labels</em><b>${b.labels.length}</b></span>
              </div>

              <button type="button" class="btn-return" data-close>Return to shelf</button>
            </article>
          </div>
          <p class="hint">Tap outside or press Esc to close</p>
        </div>
      </div>`;
  }

  /* ---------------------------------------------------------
     Render + filters
     --------------------------------------------------------- */
  function render() {
    app.innerHTML = roomHTML();
    applyFilters();
  }

  function applyFilters() {
    const match = (b) =>
      (!state.label || b.labels.includes(state.label)) &&
      (!state.status || b.status === state.status);
    let n = 0;
    app.querySelectorAll(".book").forEach(el => {
      const b = byId[el.dataset.id];
      const ok = match(b);
      if (ok) n++;
      el.classList.toggle("is-dim", !ok);
    });
    const any = !!(state.label || state.status);
    app.querySelectorAll("[data-label].chip").forEach(el => {
      el.setAttribute("aria-pressed", String(el.dataset.label === state.label));
    });
    app.querySelectorAll("[data-status].chip").forEach(el => {
      el.setAttribute("aria-pressed", String(el.dataset.status === state.status));
    });
    const count = app.querySelector("[data-count]");
    if (count) {
      count.textContent = String(n);
      const unit = count.parentElement && count.parentElement.querySelector("span");
      if (unit) unit.textContent = n === 1 ? "vol" : "vols";
    }
    const clear = app.querySelector(".chip.clear");
    if (clear) clear.hidden = !any;
  }

  /* ---------------------------------------------------------
     Open / close with FLIP-style spine flight
     --------------------------------------------------------- */
  let cleanupTimer = 0;
  let flightTimer = 0;

  function openBook(id) {
    const b = byId[id];
    if (!b || state.open) return;
    const bookEl = app.querySelector(`.book[data-id="${id}"]`);
    if (!bookEl) return;
    state.open = id;
    bookEl.classList.add("is-out");
    document.body.style.overflow = "hidden";

    detailRoot.innerHTML = detailHTML(b);
    const detail = detailRoot.querySelector(".detail");
    const closeEl = detail.querySelector(".close");

    const reveal = () => {
      if (!state.open) return;
      detail.classList.add("is-open");
      if (closeEl) closeEl.focus({ preventScroll: true });
    };

    if (reduceMotion) {
      reveal();
      return;
    }

    const rect = bookEl.getBoundingClientRect();
    const clone = bookEl.cloneNode(true);
    clone.classList.remove("is-out", "is-dim");
    clone.classList.add("flight");
    clone.removeAttribute("data-id");
    clone.setAttribute("aria-hidden", "true");
    clone.style.left = rect.left + "px";
    clone.style.top = rect.top + "px";
    clone.style.width = rect.width + "px";
    clone.style.height = rect.height + "px";
    clone.style.transition = "none";
    clone.style.transform = "none";
    document.body.appendChild(clone);

    const targetX = window.innerWidth / 2 - (rect.left + rect.width / 2);
    const targetY = Math.max(150, window.innerHeight * 0.35) - (rect.top + rect.height / 2);

    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        // (1) the spine lifts and tilts on the shelf
        clone.style.transition = "transform var(--dur-lift) var(--ease-out)";
        clone.style.transform = "translateY(-13px) rotate(0.9deg) scale(1.02)";
      });

      // (2) it travels toward the viewer and the panel opens beneath it
      flightTimer = window.setTimeout(() => {
        clone.style.transition = "transform 460ms var(--ease-out), opacity 230ms var(--ease-io) 170ms";
        clone.style.transform = `perspective(760px) translate(${targetX}px, ${targetY}px) rotateY(-44deg) scale(2.35)`;
        clone.style.opacity = "0";
        window.setTimeout(reveal, 170);
      }, 190);
    });

    window.setTimeout(() => clone.remove(), 900);
  }

  function closeBook() {
    if (!state.open) return;
    const id = state.open;
    const detail = detailRoot.querySelector(".detail");
    state.open = null;
    window.clearTimeout(flightTimer);
    document.body.style.overflow = "";
    if (detail) {
      detail.classList.add("is-closing");
      detail.classList.remove("is-open");
    }
    const bookEl = app.querySelector(`.book[data-id="${id}"]`);
    const finish = () => {
      if (bookEl) bookEl.classList.remove("is-out");
      detailRoot.innerHTML = "";
    };
    window.clearTimeout(cleanupTimer);
    if (reduceMotion) finish();
    else cleanupTimer = window.setTimeout(finish, 330);
  }

  /* ---------------------------------------------------------
     Events
     --------------------------------------------------------- */
  app.addEventListener("click", (e) => {
    const clear = e.target.closest("[data-clear]");
    if (clear) { state.label = null; state.status = null; applyFilters(); return; }
    const lab = e.target.closest("[data-label]");
    if (lab) {
      const k = lab.dataset.label;
      state.label = state.label === k ? null : k;
      applyFilters(); return;
    }
    const st = e.target.closest("[data-status]");
    if (st) {
      const s = st.dataset.status;
      state.status = state.status === s ? null : s;
      applyFilters(); return;
    }
    const book = e.target.closest(".book[data-id]");
    if (book) openBook(book.dataset.id);
  });

  detailRoot.addEventListener("click", (e) => {
    if (e.target.closest("[data-close]")) closeBook();
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && state.open) closeBook();
  });

  render();
})();
</script>
</body>
</html>
