name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: Fast gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core
            spine

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run fast gate
        run: ./scripts/check.sh
        env:
          CHECK_LOG_DIR: ${{ runner.temp }}/check-logs

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Upload check logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: check-logs
          path: ${{ runner.temp }}/check-logs
          retention-days: 7

  android:
    name: Android APK (manual)
    # Manual only: needs the Android SDK/NDK and downloads the optional model
    # assets. Signing is skipped when no release keystore is present.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --licenses < <(yes 2>/dev/null) >/dev/null
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Fetch optional spine assets
        # The MI-GAN model and the ONNX Runtime AAR are large local/build
        # artifacts, not checked in. Download them to the runner temp dir and
        # point the staging script at them, so nothing writes to .scratch.
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/android-assets"
          assets="$RUNNER_TEMP/android-assets"

          if [[ ! -f "$assets/migan_pipeline_v2.onnx" ]]; then
            curl -L --fail --retry 3 -o "$assets/migan_pipeline_v2.onnx" \
              "https://huggingface.co/CardAnvilModels/MI-GAN-ONNX/resolve/main/migan_pipeline_v2.onnx"
          fi

          if [[ ! -f "$assets/onnxruntime-android-1.20.0.aar" ]]; then
            curl -L --fail --retry 3 -o "$assets/onnxruntime-android-1.20.0.aar" \
              "https://repo1.maven.org/maven2/com/microsoft/onnxruntime/onnxruntime-android/1.20.0/onnxruntime-android-1.20.0.aar"
          fi

      - name: Report signing mode
        run: |
          if [[ -f "$HOME/.android-keys/pocketlibrary-release.jks" \
                && -r "$HOME/.android-keys/pocketlibrary.pass" ]]; then
            echo "Release keystore found; building a signed release APK."
          else
            echo "::notice::No release keystore on this runner: signing is skipped and a debug APK is built."
          fi

      - name: Build APK
        run: ./scripts/android-build.sh
        env:
          POCKETLIBRARY_ANDROID_UNSIGNED: "1"
          SPINE_MIGAN: ${{ runner.temp }}/android-assets/migan_pipeline_v2.onnx
          ORT_AAR: ${{ runner.temp }}/android-assets/onnxruntime-android-1.20.0.aar

      - name: Assert APK contents
        run: |
          set -euo pipefail
          APK="$(ls -t src-tauri/gen/android/app/build/outputs/apk/universal/*/app-universal-*.apk | head -n1)"
          test -f "$APK"
          echo "APK: $APK"

          unzip -l "$APK" > apk-contents.txt
          for entry in \
            assets/spine/det.onnx \
            assets/spine/rec.onnx \
            assets/spine/keys.txt \
            assets/spine/migan_pipeline_v2.onnx \
            lib/arm64-v8a/libonnxruntime.so; do
            grep -q "$entry" apk-contents.txt
            echo "found $entry"
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pocketlibrary-apk
          path: src-tauri/gen/android/app/build/outputs/apk/universal/*/app-universal-*.apk
          retention-days: 7
